# Unified FE + BE + DB stack (S17). One command brings the whole app up from images:
# Postgres, a one-off migrate+seed step (the backend image running `alembic upgrade
# head`), the backend (gunicorn), and the frontend (nginx serving the SPA with the API
# URL injected at start). Two uses:
#   • FE integration tests — build the images locally, `docker compose up`.
#   • Real-Jenkins smoke   — set BACKEND_IMAGE/FRONTEND_IMAGE to the ECR refs and pull.
#
# Override via a `.env` beside this file:
#   BACKEND_IMAGE, FRONTEND_IMAGE  image refs (default: locally-built names)
#   JWT_SECRET                     REQUIRED (no default; the app rejects the placeholder)
#   PUBLIC_BASE_URL                backend URL the CI agent / ci-setup snippet targets
#   API_BASE_URL                   backend URL the browser (SPA) calls
#   CORS_ALLOW_ORIGINS             the SPA origin the backend allows
#   FRONTEND_PORT, BACKEND_PORT    host ports (default 8080 / 8000)

# Preserve the existing Compose project and volumes after the checkout rename.
name: modelmatch-frontend

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: modelmatch
      POSTGRES_PASSWORD: modelmatch
      POSTGRES_DB: modelmatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelmatch -d modelmatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off: build the schema + seed the catalog with the SAME backend image, then exit.
  # (Migrations are a separate step, never on serve-startup — mirrors the K8s migrate-Job.)
  migrate:
    image: ${BACKEND_IMAGE:-driftplain-backend:latest}
    command:
      - sh
      - -c
      - "alembic upgrade head && python -c \"from app.db import SessionLocal; from app.catalog.seed import load_seed; s=SessionLocal(); load_seed(s); s.commit()\""
    environment:
      DATABASE_URL: postgresql+psycopg://modelmatch:modelmatch@db:5432/modelmatch
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    image: ${BACKEND_IMAGE:-driftplain-backend:latest}
    environment:
      DATABASE_URL: postgresql+psycopg://modelmatch:modelmatch@db:5432/modelmatch
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      LLM_CLIENT: ${LLM_CLIENT:-fake}
      BLOB_STORE: fake
      SECRET_STORE: fake
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:8080}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    image: ${FRONTEND_IMAGE:-driftplain-frontend:latest}
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      - backend

volumes:
  pgdata:
